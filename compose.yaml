x-node-service: &node-service
  build:
    context: .
    dockerfile: docker/node-dev.Dockerfile
  working_dir: /workspace
  volumes:
    - .:/workspace
    - root_node_modules:/workspace/node_modules
    - api_node_modules:/workspace/apps/api-node/node_modules
    - web_node_modules:/workspace/apps/web/node_modules
    - contracts_node_modules:/workspace/packages/contracts/node_modules
    - backend_node_modules:/workspace/packages/backend/node_modules
    - api_client_node_modules:/workspace/packages/api-client/node_modules
    - database_node_modules:/workspace/packages/database/node_modules
    - pnpm_store:/workspace/.pnpm-store

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: starter
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: starter
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 30

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"

  deps:
    <<: *node-service
    command: pnpm install --frozen-lockfile

  migrate:
    <<: *node-service
    profiles: [tools]
    environment:
      DATABASE_URL: postgresql://starter:starter@postgres:5432/starter
    command: pnpm --filter @starter/api-node db:migrate

  seed:
    <<: *node-service
    profiles: [tools]
    environment:
      DATABASE_URL: postgresql://starter:starter@postgres:5432/starter
    command: pnpm --filter @starter/api-node db:seed

  db-test:
    <<: *node-service
    profiles: [tools]
    # 変数が無ければ DB 名が空になり、統合テストの guard が拒否する。`:?` にしないのは、
    # compose が使わないサービスも含めてファイル全体を展開し、pnpm dev まで失敗させるため。
    environment:
      DATABASE_URL: postgresql://starter:starter@postgres:5432/${STARTER_DATABASE_TEST_NAME:-}
      STARTER_DATABASE_TEST_NAME: ${STARTER_DATABASE_TEST_NAME:-}
      STARTER_DATABASE_TEST_PROJECT: ${COMPOSE_PROJECT_NAME:-}
    command: pnpm vitest --config vitest.database.config.ts run

  api:
    <<: *node-service
    environment:
      NODE_ENV: development
      AUTH_PROVIDER: dev
      APP_ORIGIN: http://127.0.0.1:${WEB_PORT:-5173}
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://starter:starter@postgres:5432/starter
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: hono-starter-api
    command: pnpm --filter @starter/api-node dev
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
      deps:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/healthz').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))
      interval: 2s
      timeout: 2s
      retries: 30

  web:
    <<: *node-service
    environment:
      API_PROXY_TARGET: http://api:3000
    command: pnpm --filter @starter/web exec react-router dev --host 0.0.0.0 --port 5173
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    depends_on:
      deps:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5173/projects').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  postgres_data:
  root_node_modules:
  api_node_modules:
  web_node_modules:
  contracts_node_modules:
  backend_node_modules:
  api_client_node_modules:
  database_node_modules:
  pnpm_store:
